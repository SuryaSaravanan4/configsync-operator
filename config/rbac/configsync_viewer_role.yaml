# This rule is not used by the project configsync-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to platform.saravanan.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: configsync-operator
    app.kubernetes.io/managed-by: kustomize
  name: configsync-viewer-role
rules:
- apiGroups:
  - platform.saravanan.dev
  resources:
  - configsyncs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - platform.saravanan.dev
  resources:
  - configsyncs/status
  verbs:
  - get
